name: Ticket sync

# tickets/*.md on main  ->  Issues ("Ticket 001 - ...") + Project board
# Issues tab (assign / unassign / close / reopen)  ->  tickets/*.md on main  ->  board
on:
  push:
    branches: [main]
    paths: ["tickets/**"]
  issues:
    types: [assigned, unassigned, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # hourly safety net in case a run was missed

permissions:
  contents: write
  issues: write

concurrency:
  group: ticket-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Classic personal access token with scopes: repo, project.
      # Needed because a user-owned Project board can't be edited with the default token.
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN || github.token }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Push back with the owner's token so the branch protection on main lets it through.
          token: ${{ secrets.PROJECT_TOKEN || github.token }}

      - name: Issue change -> ticket file
        id: from_issue
        if: github.event_name == 'issues'
        run: python3 scripts/ticket.py from-issue

      - name: Ticket files -> Issues + Project board
        id: sync
        run: python3 scripts/ticket.py sync-github

      - name: Commit ticket file updates to main
        # Committed through the API with PROJECT_TOKEN: signed (Verified) and
        # authored by the token's owner, not by a bot.
        run: python3 scripts/commit_tickets_signed.py "${{ steps.from_issue.outputs.message || 'tickets: record issue numbers' }}"
