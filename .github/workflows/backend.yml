name: Backend tests

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zebitans
          POSTGRES_PASSWORD: zebitans
          POSTGRES_DB: zebitans_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://zebitans:zebitans@localhost:5432/zebitans_test
      TEST_DATABASE_URL: postgres://zebitans:zebitans@localhost:5432/zebitans_test
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
