# local postgres for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zebitans
      POSTGRES_PASSWORD: zebitans
      POSTGRES_DB: zebitans
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata:
